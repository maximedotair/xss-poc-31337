<!DOCTYPE html>
<html><head><title>DIAG5</title>
<script>
var log=[];
function done(){document.title='DIAG5|'+log.join('|')}
function t1(){fetch('http://172.17.0.1:8080/',{mode:'no-cors'}).then(function(){log.push('t1res')}).catch(function(e){log.push('t1err:'+e)}).finally(done)}
function t2(){fetch('http://example.com/',{mode:'no-cors'}).then(function(){log.push('t2res')}).catch(function(e){log.push('t2err:'+e)}).finally(done)}
setTimeout(t1,300); setTimeout(t2,600); setTimeout(done,4000);
</script>
</head><body><h1>Diag5</h1></body></html>
